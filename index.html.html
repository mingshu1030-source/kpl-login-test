<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>議會題庫｜Google 登入測試</title><style>body{font-family:system-ui,'Noto Sans TC',sans-serif;background:#f5f7fb;color:#172b4d;margin:0;padding:32px 16px}.panel{max-width:540px;margin:50px auto;background:white;border:1px solid #dce3ee;border-radius:16px;padding:30px;box-shadow:0 8px 25px #1232 10}h1{font-size:24px}p{line-height:1.7}#result{white-space:pre-wrap;background:#f3f6fa;border-radius:8px;padding:14px;margin-top:18px}small{color:#526277}button{padding:9px 16px;cursor:pointer}</style></head><body><main class="panel"><h1>議會題庫｜Google 登入測試</h1><p>這是獨立測試頁，不連接議會題庫、Google 試算表或 Drive，也不提供任何編輯權限。</p><div id="g_id_onload" data-client_id="914390946666-3i83u0l6rjc5laqtd48qas0v1681sreg.apps.googleusercontent.com" data-callback="onGoogleCredential" data-auto_prompt="false"></div><div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline" data-text="signin_with" data-shape="rectangular"></div><div id="result" role="status">等待 Google 登入…</div><p><small>僅顯示登入回傳的基本資訊供測試。這裡的資訊尚未經後端驗證，不能據此授予權限。請勿分享登入憑證或含憑證的截圖。</small></p></main><script>function onGoogleCredential(response){try{const part=response.credential.split('.')[1];const normalized=part.replace(/-/g,'+').replace(/_/g,'/');const json=JSON.parse(decodeURIComponent(Array.from(atob(normalized),c=>'%'+c.charCodeAt(0).toString(16).padStart(2,'0')).join('')));document.getElementById('result').textContent='已收到 Google 登入回應（尚未經伺服器驗證）\n帳號：'+(json.email||'未提供')+'\n姓名：'+(json.name||'未提供')+'\n請不要將此結果視為正式授權。';}catch(e){document.getElementById('result').textContent='收到登入回應，但解析失敗：'+e.message;}}</script><script src="https://accounts.google.com/gsi/client" async defer></script></body></html>
